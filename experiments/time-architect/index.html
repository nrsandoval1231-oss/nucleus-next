<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091622"><title>Nucleus Next · Time Architect</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7eee2;background:#07121d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#1b3242 0%,#0b1a29 42%,#07121d 80%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #f6c58b;outline-offset:3px}.shell{max-width:680px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}.top{display:flex;align-items:center;justify-content:space-between}.brand{letter-spacing:.22em;font-size:11px;color:#ebc18c;font-weight:700}.sub{font-size:10px;color:#91a6b8;letter-spacing:.14em;margin-top:5px}.pill{border:1px solid #385168;border-radius:30px;padding:7px 10px;font-size:10px;color:#bfd0db}.title{text-align:center;margin:8px 0 0;font-weight:500;font-family:Georgia,serif;font-size:clamp(30px,7.5vw,45px)}.hint{text-align:center;margin:0;color:#acc1ce;font-size:13px}.project{display:flex;gap:7px;overflow-x:auto;padding:4px 2px}.project button{flex:none;background:#142839;color:#bdcbd4;border:1px solid #304b60;border-radius:30px;padding:10px 13px;font-size:12px}.project button.on{background:#3a4350;border-color:#e8bd86;color:#f9e6ca}.scene{position:relative;min-height:270px;display:grid;place-items:center;overflow:hidden}.scene svg{width:min(100%,450px);height:270px}.panel{background:#102433;border:1px solid #2d4556;border-radius:20px;padding:18px;display:grid;gap:13px;box-shadow:0 16px 45px #0003}.panel h2{font-size:16px;margin:0;font-weight:600}.panel p{font-size:13px;line-height:1.6;color:#b6c8d3;margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:11px;color:#e3bb88;letter-spacing:.07em;text-transform:uppercase}.status{font-size:11px;color:#eab4a7}.choices{display:grid;gap:8px}.choice{padding:12px;border-radius:11px;border:1px solid #344f61;background:#162d3d;color:#dfe9ee;text-align:left;font-size:13px}.choice.selected{border-color:#e9bf88;background:#35404a}.choice small{display:block;color:#9fb4c2;margin-top:4px}.primary{border:1px solid #ebc18c;background:#d6ae79;color:#172332;border-radius:12px;padding:13px;font-weight:700}.secondary{border:1px solid #496274;background:#142b3b;color:#e9dfd2;border-radius:12px;padding:12px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.nav button{padding:12px 3px;background:#142a3b;color:#aebec9;border:1px solid #334d60;border-radius:13px;font-size:11px}.nav button.on{border-color:#ebc18c;background:#35414c;color:#f7dcad}.footer{text-align:center;color:#708fa4;font-size:10px;line-height:1.5}.timeline{width:100%;accent-color:#e6ba82}.evidence{border-left:2px solid #cc9d70;padding-left:12px;color:#bdccd6;font-size:12px;line-height:1.6}.scene button{position:absolute;bottom:8px;background:#172c3b;border:1px solid #587183;color:#e2c5a0;border-radius:30px;padding:8px 16px;font-size:11px}@media(min-width:650px){.shell{padding-top:38px}.scene{min-height:330px}.scene svg{height:320px}}
@media(prefers-reduced-motion:no-preference){.glass{transition:opacity .28s,transform .28s}.scene svg{animation:reveal .45s ease-out}@keyframes reveal{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">NUCLEUS NEXT</div><div class="sub">TIME ARCHITECT / EXPERIMENT</div></div><span class="pill">SAMPLE DATA</span></header><div><h1 class="title" id="title">The Living Present</h1><p class="hint" id="hint">What matters now, without the noise.</p></div><nav class="project" id="projects" aria-label="Sample projects"></nav><section class="scene" aria-label="Abstract project architecture"><svg viewBox="0 0 400 270" role="img" aria-label="Interactive visual metaphor of project architecture"><defs><linearGradient id="crystal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dcebf0" stop-opacity=".57"/><stop offset=".48" stop-color="#e9bd81" stop-opacity=".27"/><stop offset="1" stop-color="#427b94" stop-opacity=".35"/></linearGradient><radialGradient id="glow"><stop stop-color="#e8b980" stop-opacity=".32"/><stop offset="1" stop-color="#e8b980" stop-opacity="0"/></radialGradient></defs><ellipse cx="200" cy="219" rx="170" ry="40" fill="url(#glow)"/><g id="architecture"><path class="glass" d="M200 15 L268 55 L285 190 L200 240 L115 190 L132 55 Z" fill="url(#crystal)" stroke="#e7c28f" stroke-width="1.5"/><path d="M200 15 V240 M132 55 L200 105 L268 55 M115 190 L200 150 L285 190 M200 105 V150" fill="none" stroke="#edc99a" stroke-opacity=".7"/></g><g id="layers" hidden></g><g id="branches" hidden><path d="M271 130 C315 103 329 80 390 65 M271 130 C319 149 335 180 390 199" stroke="#b1d0de" stroke-width="2" fill="none"/><circle cx="385" cy="65" r="6" fill="#edc18b"/><circle cx="385" cy="199" r="6" fill="#77aabe"/></g><path d="M24 245 H376" stroke="#cca577" stroke-opacity=".55"/><circle id="marker" cx="200" cy="245" r="5" fill="#f5c589"/><text x="46" y="263" font-size="10" fill="#9cbbcb">PAST</text><text x="186" y="263" font-size="10" fill="#edd0a5">NOW</text><text x="328" y="263" font-size="10" fill="#9cbbcb">FUTURE</text></svg></section><nav class="nav" id="modes" aria-label="Experience modes"><button data-mode="present" class="on">Present</button><button data-mode="xray">X-Ray</button><button data-mode="time">Time</button><button data-mode="future">Future</button></nav><section class="panel" id="panel" aria-live="polite"></section><footer class="footer">Interactive concept · illustrative evidence and scenarios · no GitHub integration or external actions</footer></main>
<script>
(()=>{'use strict';
const projects=['Orloom','GridLens','TrailForge','MeGraph'];const components=[['Interface','Deployed UI'],['Application services','Implemented'],['Worker execution','Requires independent verification'],['Verification','Partial evidence'],['Infrastructure','Deployed UI host']];const history=['Core architecture and lifecycle established','Verification capabilities implemented','Owner-facing interface deployed','Worker execution still not independently verified'];let project='Orloom',mode='present',layer=2,moment=3,path='verify',proposal=false;
const q=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){q('projects').innerHTML=projects.map(p=>'<button data-project="'+p+'" class="'+(p===project?'on':'')+'">'+p+'</button>').join('');q('modes').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const headings={present:'The Living Present',xray:'Architectural X-Ray',time:'Time Echo',future:'Possibility Chamber'},hints={present:'What matters now, without the noise.',xray:'Reveal what is beneath the surface.',time:'Understand how we reached this moment.',future:'Explore possibilities without altering reality.'};q('title').textContent=headings[mode];q('hint').textContent=hints[mode];q('layers').setAttribute('hidden','');q('branches').setAttribute('hidden','');q('architecture').setAttribute('opacity',mode==='xray'?'0.13':'1');q('marker').setAttribute('cx',mode==='time'?'85':mode==='future'?'310':'200');
if(mode==='xray'){const g=q('layers');g.removeAttribute('hidden');g.innerHTML=components.map((c,i)=>'<g opacity="'+(layer===i?'1':'.42')+'"><path d="M110 '+(23+i*37)+' L200 '+(2+i*37)+' L290 '+(23+i*37)+' L200 '+(49+i*37)+' Z" fill="'+(i===2?'#704551':'url(#crystal)')+'" stroke="'+(layer===i?'#ffd49c':'#9cb8c8')+'" stroke-width="'+(layer===i?2:1)+'"/><text x="200" y="'+(28+i*37)+'" fill="#fff" font-size="11" text-anchor="middle">'+esc(c[0])+'</text></g>').join('');}if(mode==='future')q('branches').removeAttribute('hidden');
const selected=project==='Orloom';let content='';
if(mode==='present')content='<div class="row"><h2>'+esc(project)+'</h2><span class="status">Illustrative state</span></div><p>'+(selected?'Owner-facing UI is deployed. The complete autonomous engineering delivery workflow remains unverified.':'Select this project to explore the interaction model. Live repository evidence has not been connected.')+'</p>'+(proposal?'<p class="evidence">Proposed action captured locally in this session. No repository was modified.</p>':'')+'<button class="primary" data-action="xray">Unfold architecture →</button>';
if(mode==='xray')content='<h2>Inspect a subsystem</h2><div class="choices">'+components.map((c,i)=>'<button class="choice '+(i===layer?'selected':'')+'" data-layer="'+i+'">'+esc(c[0])+'<small>'+esc(c[1])+'</small></button>').join('')+'</div><p class="evidence">'+(layer===2?'Illustrative gap: end-to-end worker execution and termination require independently verified evidence.':'Subsystem descriptions are illustrative abstractions; this demo does not claim source inspection.')+'</p><button class="primary" data-action="time">Trace through time →</button>';
if(mode==='time')content='<h2>Trace a recorded state</h2><label class="label" for="scrub">Historical moment '+(moment+1)+' of 4</label><input id="scrub" class="timeline" type="range" min="0" max="3" step="1" value="'+moment+'"><p>'+history[moment]+'</p><p class="evidence">Illustrative chronology, not a historical replay derived from GitHub.</p><button class="primary" data-action="future">Explore possible futures →</button>';
if(mode==='future')content='<h2>Compare possible paths</h2><div class="choices"><button class="choice '+(path==='verify'?'selected':'')+'" data-path="verify">Verify engineering execution<small>Addresses a blocking requirement, subject to independent tests.</small></button><button class="choice '+(path==='features'?'selected':'')+'" data-path="features">Continue feature development<small>Adds capability but does not establish execution readiness.</small></button></div><p class="evidence">These are hypothetical alternatives, not predictions. No estimated completion dates or success probabilities are implied.</p><button class="primary" data-action="record">'+(proposal?'Proposal recorded locally':'Record proposed path')+'</button>'+(proposal?'<button class="secondary" data-action="present">Return to the Living Present →</button>':'');
q('panel').innerHTML=content;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.project){project=b.dataset.project;mode='present';proposal=false}else if(b.dataset.mode){mode=b.dataset.mode}else if(b.dataset.layer!==undefined){layer=Number(b.dataset.layer)}else if(b.dataset.path){path=b.dataset.path}else if(b.dataset.action){if(b.dataset.action==='record')proposal=true;else mode=b.dataset.action}render()});document.addEventListener('input',e=>{if(e.target.id==='scrub'){moment=Number(e.target.value);render()}});render();
})();
</script></body></html>
